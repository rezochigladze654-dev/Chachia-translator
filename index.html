<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101b36">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chachia Translator</title>
<link rel="manifest" href="./manifest.json">

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  width: 100%;
  min-height: 100%;
  background: #101b36;
}

body {
  margin: 0;
  padding:
    max(12px, env(safe-area-inset-top))
    14px
    max(15px, env(safe-area-inset-bottom));
  min-height: 100vh;
  min-height: 100dvh;
  background: #101b36;
  color: white;
  font-family: Arial, sans-serif;
}

main {
  width: 100%;
  max-width: 650px;
  margin: auto;
}

header {
  text-align: center;
  padding: 12px 0 18px;
}

h1 {
  margin: 0;
  font-size: 28px;
  color: white;
}

.sub {
  margin-top: 7px;
  color: #aab9d6;
  font-size: 14px;
}

.panel {
  background: #1b2a49;
  border: 1px solid #344769;
  border-radius: 18px;
  padding: 15px;
  margin-bottom: 15px;
}

label {
  display: block;
  font-weight: bold;
  font-size: 16px;
  margin-bottom: 12px;
}

textarea {
  width: 100%;
  min-height: 135px;
  resize: vertical;
  border: 1px solid #344769;
  border-radius: 12px;
  padding: 14px;
  background: #0e1930;
  color: white;
  font-size: 19px;
  line-height: 1.5;
  outline: none;
  font-family: Arial, sans-serif;
}

textarea:focus {
  border-color: #5595f0;
}

textarea::placeholder {
  color: #8999b8;
}

.actions {
  display: flex;
  gap: 9px;
  margin-top: 12px;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 14px 10px;
  min-height: 49px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  color: white;
  touch-action: manipulation;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.actions button {
  flex: 1;
  min-width: 0;
}

.mic {
  background: #315c9d;
}

.mic.active {
  background: #d34c55;
}

.mainbtn {
  background: #3979db;
}

.secondary {
  background: #344563;
}

.status {
  text-align: center;
  color: #b8c9e8;
  font-size: 14px;
  min-height: 24px;
  padding: 3px;
}

#translated {
  min-height: 120px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 20px;
  line-height: 1.55;
  color: white;
}

.footer {
  text-align: center;
  color: #8294b6;
  font-size: 12px;
  padding: 15px 0;
}

.fullscreen {
  background: #263b60;
  width: 100%;
  margin-top: 10px;
}

@media (max-width: 380px) {
  body {
    padding-left: 9px;
    padding-right: 9px;
  }

  .panel {
    padding: 12px;
  }

  button {
    font-size: 13px;
  }
}
</style>
</head>

<body>
<main>

<header>
  <h1>Chachia Translator</h1>
  <div class="sub">ქართული ⇄ გერმანული</div>
</header>

<div class="panel">
  <label>ჩაწერე ტექსტი</label>

  <textarea id="source"
    placeholder="დაწერე ქართულად ან გერმანულად..."
    autocomplete="off"
    spellcheck="false"></textarea>

  <div class="actions">
    <button class="mic" id="kaMic">🎤 ქართული</button>
    <button class="mic" id="deMic">🎤 Deutsch</button>
  </div>
</div>

<div class="status" id="status">მზად არის</div>

<div class="panel">
  <label>თარგმანი</label>

  <div id="translated">აქ გამოჩნდება თარგმანი...</div>

  <div class="actions">
    <button class="mainbtn" id="speakBtn">🔊 მოსმენა</button>
    <button class="secondary" id="copyBtn">📋 კოპირება</button>
  </div>

  <div class="actions">
    <button class="secondary" id="clearBtn">🗑 გასუფთავება</button>
  </div>
</div>

<button class="fullscreen" id="fullBtn">
  ⛶ სრულ ეკრანზე გახსნა
</button>

<div class="footer">
  Chachia Translator · Georgian ⇄ German
</div>

</main>

<script>
"use strict";

const $ = id => document.getElementById(id);

const source = $("source");
const translated = $("translated");
const statusBox = $("status");
const kaMic = $("kaMic");
const deMic = $("deMic");

const PLACEHOLDER = "აქ გამოჩნდება თარგმანი...";

let timer = null;
let requestNumber = 0;
let controller = null;

let recognition = null;
let micSession = 0;
let activeMic = null;

let speechToken = 0;

function setStatus(message) {
  statusBox.textContent = message;
}

function isGeorgian(text) {
  return /[\u10A0-\u10FF]/.test(text);
}

// ზედიზედ გამეორებული სიტყვებისა და ფრაზების გასუფთავება
function cleanSpeech(text) {
  let words = text
    .replace(/[\u200B-\u200D\uFEFF]/g, "")
    .trim()
    .split(/\s+/)
    .filter(Boolean);

  const norm = word => word
    .toLocaleLowerCase()
    .normalize("NFC")
    .replace(/[.,!?;:„“"'()[\]{}،؛]/g, "");

  let result = [];

  for (const word of words) {
    const key = norm(word);

    if (!key) continue;

    if (
      result.length &&
      norm(result[result.length - 1]) === key
    ) continue;

    result.push(word);
  }

  let changed = true;

  while (changed) {
    changed = false;

    for (
      let size = Math.min(10, Math.floor(result.length / 2));
      size >= 1;
      size--
    ) {
      const first = result
        .slice(-size * 2, -size)
        .map(norm).join(" ");

      const second = result
        .slice(-size)
        .map(norm).join(" ");

      if (first && first === second) {
        result.splice(-size, size);
        changed = true;
        break;
      }
    }
  }

  return result.join(" ");
}

// თარგმნის დაწყება
async function translateText() {
  const original = source.value.trim();

  if (!original) {
    translated.textContent = PLACEHOLDER;
    setStatus("მზად არის");
    return;
  }

  const thisRequest = ++requestNumber;

  if (controller) {
    controller.abort();
  }

  controller = new AbortController();

  const signal = controller.signal;

  const target = isGeorgian(original) ? "de" : "ka";

  setStatus("ითარგმნება...");

  try {
    let result = "";

    // ძირითადი მთარგმნელი
    const url =
      "https://translate.googleapis.com/translate_a/single" +
      "?client=gtx&sl=auto&tl=" +
      target +
      "&dt=t&q=" +
      encodeURIComponent(original);

    const response = await fetch(url, {
      signal,
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Google translation error");
    }

    const data = await response.json();

    result = (data[0] || [])
      .map(item => item[0] || "")
      .join("");

    if (thisRequest !== requestNumber) return;

    if (!result.trim()) {
      throw new Error("Empty translation");
    }

    translated.textContent = result;
    setStatus("თარგმნა დასრულდა ✓");

  } catch (error) {

    if (error.name === "AbortError") return;

    if (thisRequest !== requestNumber) return;

    // სარეზერვო მთარგმნელი
    try {
      const pair = target === "de" ? "ka|de" : "de|ka";

      const backupURL =
        "https://api.mymemory.translated.net/get?q=" +
        encodeURIComponent(original) +
        "&langpair=" + pair;

      const response = await fetch(backupURL, {
        signal
      });

      if (!response.ok) {
        throw new Error("Backup error");
      }

      const data = await response.json();

      if (thisRequest !== requestNumber) return;

      const backup = data.responseData?.translatedText;

      if (backup) {
        translated.textContent = backup;
        setStatus("თარგმნა დასრულდა ✓");
      } else {
        setStatus("თარგმანი ვერ მოიძებნა");
      }

    } catch (e) {
      if (e.name === "AbortError") return;

      if (thisRequest === requestNumber) {
        setStatus("ინტერნეტთან კავშირი შეამოწმე");
      }
    }
  }
}

// ავტომატური თარგმნა
function scheduleTranslation() {
  clearTimeout(timer);

  timer = setTimeout(() => {
    translateText();
  }, 650);
}

source.addEventListener("input", scheduleTranslation);

// მიკროფონის მართვა
function resetMicButtons() {
  kaMic.disabled = false;
  deMic.disabled = false;

  kaMic.classList.remove("active");
  deMic.classList.remove("active");

  kaMic.textContent = "🎤 ქართული";
  deMic.textContent = "🎤 Deutsch";
}

function stopMic() {
  micSession++;

  const old = recognition;

  recognition = null;
  activeMic = null;

  resetMicButtons();

  if (old) {
    try {
      old.abort();
    } catch (e) {}
  }
}

function startMic(language) {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    setStatus(
      "მიკროფონი ამ ბრაუზერში არ არის მხარდაჭერილი. სცადე Chrome."
    );
    return;
  }

  // წინა მიკროფონის სესიის დახურვა
  stopMic();

  const session = micSession;
  const current = new SpeechRecognition();

  recognition = current;
  activeMic = language;

  let handled = false;

  current.lang = language;
  current.continuous = false;
  current.interimResults = false;
  current.maxAlternatives = 1;

  kaMic.disabled = true;
  deMic.disabled = true;

  const selectedButton =
    language === "ka-GE" ? kaMic : deMic;

  selectedButton.classList.add("active");
  selectedButton.textContent = "🔴 გისმენ...";

  setStatus("🎤 გისმენ... ილაპარაკე");

  current.onresult = function(event) {
    if (session !== micSession) return;
    if (handled) return;

    let parts = [];

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {
      if (event.results[i].isFinal) {
        parts.push(event.results[i][0].transcript);
      }
    }

    const transcript = cleanSpeech(parts.join(" "));

    if (!transcript) return;

    handled = true;

    // ერთი შედეგი, ერთი ჩაწერა
    source.value = transcript;

    clearTimeout(timer);

    // წინა მოთხოვნების გაუქმება
    if (controller) controller.abort();

    translateText();

    setStatus("ამოცნობა დასრულდა ✓");

    try {
      current.stop();
    } catch (e) {}
  };

  current.onerror = function(event) {
    if (session !== micSession) return;

    recognition = null;
    activeMic = null;

    resetMicButtons();

    if (event.error === "not-allowed") {
      setStatus("მიკროფონის ნებართვა ჩართე");
    } else if (event.error === "no-speech") {
      setStatus("ხმა ვერ გავიგე. კიდევ სცადე");
    } else if (event.error === "network") {
      setStatus("მიკროფონის ქსელური შეცდომა");
    } else if (event.error === "aborted") {
      setStatus("მიკროფონი შეჩერდა");
    } else {
      setStatus("მიკროფონის შეცდომა: " + event.error);
    }
  };

  current.onend = function() {
    if (session !== micSession) return;

    recognition = null;
    activeMic = null;

    resetMicButtons();

    if (!handled) {
      setStatus("მზად არის");
    }
  };

  try {
    current.start();
  } catch (error) {
    if (session === micSession) {
      recognition = null;
      activeMic = null;

      resetMicButtons();

      setStatus("მიკროფონი ვერ ჩაირთო. კიდევ სცადე");
    }
  }
}

kaMic.addEventListener("click", () => {
  startMic("ka-GE");
});

deMic.addEventListener("click", () => {
  startMic("de-DE");
});

// თარგმანის გახმოვანება
$("speakBtn").addEventListener("click", () => {
  const text = translated.textContent;

  if (!text || text === PLACEHOLDER) return;

  if (!("speechSynthesis" in window)) {
    setStatus("გახმოვანება მიუწვდომელია");
    return;
  }

  speechToken++;

  speechSynthesis.cancel();

  const token = speechToken;
  const utterance = new SpeechSynthesisUtterance(text);

  utterance.lang = isGeorgian(text) ? "ka-GE" : "de-DE";
  utterance.rate = 0.9;
  utterance.pitch = 1;

  utterance.onstart = () => {
    if (token === speechToken) {
      setStatus("🔊 ტექსტი იკითხება...");
    }
  };

  utterance.onend = () => {
    if (token === speechToken) {
      setStatus("მზად არის");
    }
  };

  utterance.onerror = () => {
    if (token === speechToken) {
      setStatus("გახმოვანება ვერ მოხერხდა");
    }
  };

  speechSynthesis.speak(utterance);
});

// კოპირება
$("copyBtn").addEventListener("click", async () => {
  const text = translated.textContent;

  if (!text || text === PLACEHOLDER) return;

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const temp = document.createElement("textarea");

      temp.value = text;
      temp.style.position = "fixed";
      temp.style.opacity = "0";

      document.body.appendChild(temp);
      temp.select();

      const success = document.execCommand("copy");

      temp.remove();

      if (!success) throw new Error("Copy failed");
    }

    setStatus("ტექსტი დაკოპირდა ✓");

  } catch (e) {
    setStatus("კოპირება ვერ მოხერხდა");
  }
});

// გასუფთავება
$("clearBtn").addEventListener("click", () => {
  stopMic();

  clearTimeout(timer);

  requestNumber++;

  if (controller) {
    controller.abort();
    controller = null;
  }

  speechToken++;

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

  source.value = "";
  translated.textContent = PLACEHOLDER;

  setStatus("გასუფთავებულია");
});

// სრულ ეკრანზე გახსნა
$("fullBtn").addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) {
      if (document.documentElement.requestFullscreen) {
        await document.documentElement.requestFullscreen();
      } else {
        setStatus("სრული ეკრანი ამ ბრაუზერში მიუწვდომელია");
      }
    } else {
      await document.exitFullscreen();
    }
  } catch (e) {
    setStatus("სრული ეკრანის რეჟიმი მიუწვდომელია");
  }
});

// აპლიკაციის Service Worker
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker
      .register("./sw.js")
      .catch(() => {});
  });
}

</script>
</body>
</html>
