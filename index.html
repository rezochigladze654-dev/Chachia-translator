
<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101b36">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chachia Translator</title>
<link rel="manifest" href="./manifest.json">

<style>
*{box-sizing:border-box}
html{width:100%;min-height:100%}
body{
 margin:0;padding:0;width:100%;
 min-height:100vh;min-height:100dvh;
 background:#101b36;color:white;
 font-family:Arial,sans-serif;
}
main{
 width:100%;max-width:560px;margin:auto;
 padding:22px 16px 34px;
 min-height:100vh;min-height:100dvh;
}
h1{text-align:center;font-size:27px;margin:15px 0 5px}
.sub{text-align:center;color:#aab9d6;margin-bottom:25px}
.panel{
 width:100%;background:#1b2a49;
 border:1px solid #344769;border-radius:18px;
 padding:16px;margin:13px 0;
}
label{display:block;font-weight:bold;margin-bottom:12px}
textarea{
 display:block;width:100%;min-height:105px;
 resize:vertical;border:0;border-radius:12px;
 padding:14px;background:#0e1930;color:white;
 font-size:18px;outline:none;line-height:1.5;
}
textarea::placeholder{color:#8999b8}
button{
 border:0;border-radius:12px;padding:13px 15px;
 font-size:15px;font-weight:bold;cursor:pointer;
 touch-action:manipulation;
}
button:disabled{opacity:.5}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.actions button{flex:1;min-width:0}
.mic{background:#315c9d;color:white}
.mic.active{background:#d34c55;color:white}
.mainbtn{background:#3979db;color:white}
.secondary{background:#344563;color:white}
#translated{
 min-height:100px;white-space:pre-wrap;
 overflow-wrap:anywhere;font-size:19px;
 line-height:1.5;color:white;
}
.status{
 text-align:center;color:#b8c9e8;
 font-size:14px;min-height:22px;
}
.footer{
 text-align:center;color:#8294b6;
 font-size:12px;margin:25px 0;
}
@media(max-width:360px){
 main{padding:12px 10px 30px}
 .panel{padding:13px}
 .actions button{font-size:12px;padding:12px 5px}
 h1{font-size:24px}
}
</style>
</head>

<body>
<main>

<h1>Chachia Translator</h1>
<div class="sub">ქართული ⇄ გერმანული</div>

<div class="panel">
<label>ჩაწერე ტექსტი</label>
<textarea id="source" placeholder="დაწერე ქართულად ან გერმანულად..."></textarea>

<div class="actions">
<button class="mic" id="kaMic" type="button">🎤 ქართული</button>
<button class="mic" id="deMic" type="button">🎤 Deutsch</button>
</div>
</div>

<div class="status" id="status">მზად არის</div>

<div class="panel">
<label>თარგმანი</label>
<div id="translated">აქ გამოჩნდება თარგმანი...</div>

<div class="actions">
<button class="mainbtn" id="speakBtn" type="button">🔊 მოსმენა</button>
<button class="secondary" id="copyBtn" type="button">📋 კოპირება</button>
<button class="secondary" id="clearBtn" type="button">გასუფთავება</button>
</div>
</div>

<div class="footer">Chachia Translator · Georgian ⇄ German</div>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);

let timer = null;
let requestNumber = 0;

let recognition = null;
let micSession = 0;
let activeLanguage = null;
let listening = false;

const PLACEHOLDER = 'აქ გამოჩნდება თარგმანი...';

// ენის ამოცნობა
function isGeorgian(text){
 return /[\u10A0-\u10FF]/.test(text);
}

// გამეორებული სიტყვების გასუფთავება
function cleanSpeech(text){
 let words = text
  .replace(/[\u200B-\u200D\uFEFF]/g,'')
  .trim()
  .split(/\s+/)
  .filter(Boolean);

 const norm = word => word
  .toLocaleLowerCase()
  .normalize('NFC')
  .replace(/[.,!?;:„“"'()[\]{}،؛]/g,'');

 let result = [];

 for(const word of words){
  const key = norm(word);
  if(!key) continue;

  if(result.length && norm(result[result.length-1]) === key){
   continue;
  }

  result.push(word);
 }

 let changed = true;

 while(changed){
  changed = false;

  for(let size = Math.min(12,Math.floor(result.length/2));size>=1;size--){
   const first = result.slice(-size*2,-size).map(norm).join(' ');
   const second = result.slice(-size).map(norm).join(' ');

   if(first && first === second){
    result.splice(-size,size);
    changed = true;
    break;
   }
  }
 }

 return result.join(' ');
}

// მიკროფონის ღილაკების ვიზუალი
function updateMicButtons(){
 const ka = activeLanguage === 'ka-GE';
 const de = activeLanguage === 'de-DE';

 $('kaMic').classList.toggle('active',ka);
 $('deMic').classList.toggle('active',de);

 $('kaMic').textContent = ka ? '🔴 გამორთვა' : '🎤 ქართული';
 $('deMic').textContent = de ? '🔴 გამორთვა' : '🎤 Deutsch';

 // ღილაკები არასდროს იბლოკება
 $('kaMic').disabled = false;
 $('deMic').disabled = false;
}

// მიკროფონის გამორთვა
function stopMic(message = 'მიკროფონი გამორთულია'){
 // ძველი სესია მაშინვე უქმდება
 micSession++;

 const old = recognition;

 recognition = null;
 listening = false;
 activeLanguage = null;

 updateMicButtons();

 if(old){
  // ძველი მოვლენები აღარ იმოქმედებს ახალ სესიაზე
  old.onresult = null;
  old.onerror = null;
  old.onend = null;

  try{
   old.abort();
  }catch(e){
   try{old.stop();}catch(err){}
  }
 }

 if(message){
  $('status').textContent = message;
 }
}

// მიკროფონის ჩართვა
function startMic(language){

 const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

 if(!SpeechRecognition){
  $('status').textContent =
   'მიკროფონი მიუწვდომელია. სცადე Chrome ბრაუზერი';
  return;
 }

 // იგივე ღილაკზე მეორედ დაჭერა = გამორთვა
 if(recognition && activeLanguage === language){
  stopMic('მიკროფონი ხელით გამოირთო');
  return;
 }

 // სხვა ენის მიკროფონის გამორთვა
 if(recognition){
  stopMic(null);
 }

 const mySession = ++micSession;
 const current = new SpeechRecognition();

 recognition = current;
 activeLanguage = language;
 listening = true;

 let handled = false;

 current.lang = language;
 current.continuous = false;
 current.interimResults = false;
 current.maxAlternatives = 1;

 updateMicButtons();

 $('status').textContent =
  language === 'ka-GE'
   ? '🎤 გისმენ... ქართულად ილაპარაკე'
   : '🎤 Ich höre zu... Sprich Deutsch';

 current.onresult = function(event){

  if(mySession !== micSession) return;
  if(handled) return;

  let parts = [];

  for(let i = event.resultIndex; i < event.results.length; i++){
   const item = event.results[i];

   if(item.isFinal){
    parts.push(item[0].transcript);
   }
  }

  const transcript = cleanSpeech(parts.join(' '));

  if(!transcript) return;

  handled = true;

  $('source').value = transcript;

  clearTimeout(timer);

  translateText();

  $('status').textContent = 'ამოცნობა დასრულდა ✓';

  try{
   current.stop();
  }catch(e){}
 };

 current.onerror = function(event){

  if(mySession !== micSession) return;

  recognition = null;
  listening = false;
  activeLanguage = null;

  updateMicButtons();

  if(event.error === 'not-allowed'){
   $('status').textContent = 'მიკროფონის ნებართვა ჩართე';
  }
  else if(event.error === 'no-speech'){
   $('status').textContent = 'ხმა ვერ გავიგე. კიდევ სცადე';
  }
  else if(event.error === 'network'){
   $('status').textContent = 'მიკროფონის ქსელური შეცდომა';
  }
  else if(event.error === 'aborted'){
   $('status').textContent = 'მიკროფონი გამორთულია';
  }
  else{
   $('status').textContent = 'მიკროფონის შეცდომა: ' + event.error;
  }
 };

 current.onend = function(){

  if(mySession !== micSession) return;

  recognition = null;
  listening = false;
  activeLanguage = null;

  updateMicButtons();

  if(!handled){
   $('status').textContent = 'მზად არის';
  }
 };

 try{
  current.start();
 }catch(error){

  if(mySession === micSession){
   recognition = null;
   listening = false;
   activeLanguage = null;

   updateMicButtons();

   $('status').textContent = 'მიკროფონი ვერ ჩაირთო. კიდევ სცადე';
  }
 }
}

// ორივე ღილაკის მართვა
$('kaMic').addEventListener('click',function(){
 startMic('ka-GE');
});

$('deMic').addEventListener('click',function(){
 startMic('de-DE');
});

// Google თარგმანი + სარეზერვო თარგმანი
async function translateText(){

 const original = $('source').value.trim();

 if(!original){
  $('translated').textContent = PLACEHOLDER;
  return;
 }

 const thisRequest = ++requestNumber;
 const target = isGeorgian(original) ? 'de' : 'ka';

 $('status').textContent = 'ითარგმნება...';

 try{

  const url =
   'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl='
   + target + '&dt=t&q=' + encodeURIComponent(original);

  const response = await fetch(url);

  if(!response.ok) throw new Error('Google error');

  const data = await response.json();

  const result = (data[0] || [])
   .map(item => item[0] || '')
   .join('');

  if(thisRequest !== requestNumber) return;

  if(!result.trim()) throw new Error('Empty translation');

  $('translated').textContent = result;
  $('status').textContent = 'თარგმნა დასრულდა ✓';

 }catch(error){

  if(thisRequest !== requestNumber) return;

  try{

   const pair = target === 'de' ? 'ka|de' : 'de|ka';

   const url =
    'https://api.mymemory.translated.net/get?q='
    + encodeURIComponent(original)
    + '&langpair=' + pair;

   const response = await fetch(url);

   if(!response.ok) throw new Error('Backup error');

   const data = await response.json();

   if(thisRequest !== requestNumber) return;

   const result = data.responseData?.translatedText;

   if(result){
    $('translated').textContent = result;
    $('status').textContent = 'თარგმნა დასრულდა ✓';
   }else{
    $('status').textContent = 'თარგმანი ვერ მოიძებნა';
   }

  }catch(e){

   if(thisRequest === requestNumber){
    $('status').textContent = 'ინტერნეტთან კავშირი შეამოწმე';
   }
  }
 }
}

// ავტომატური თარგმნა
function scheduleTranslation(){
 clearTimeout(timer);
 timer = setTimeout(translateText,600);
}

$('source').addEventListener('input',scheduleTranslation);

// გახმოვანება
$('speakBtn').addEventListener('click',function(){

 const text = $('translated').textContent;

 if(!text || text === PLACEHOLDER) return;

 if(!('speechSynthesis' in window)){
  $('status').textContent = 'გახმოვანება მიუწვდომელია';
  return;
 }

 speechSynthesis.cancel();

 const utterance = new SpeechSynthesisUtterance(text);

 utterance.lang = isGeorgian(text) ? 'ka-GE' : 'de-DE';
 utterance.rate = 0.9;

 speechSynthesis.speak(utterance);
});

// კოპირება
$('copyBtn').addEventListener('click',async function(){

 const text = $('translated').textContent;

 if(!text || text === PLACEHOLDER) return;

 try{

  if(navigator.clipboard && window.isSecureContext){
   await navigator.clipboard.writeText(text);
  }else{
   const temp = document.createElement('textarea');

   temp.value = text;
   temp.style.position = 'fixed';
   temp.style.opacity = '0';

   document.body.appendChild(temp);
   temp.select();

   const success = document.execCommand('copy');

   temp.remove();

   if(!success) throw new Error('Copy failed');
  }

  $('status').textContent = 'ტექსტი დაკოპირდა ✓';

 }catch(e){
  $('status').textContent = 'კოპირება ვერ მოხერხდა';
 }
});

// გასუფთავება
$('clearBtn').addEventListener('click',function(){

 stopMic(null);

 clearTimeout(timer);
 requestNumber++;

 $('source').value = '';
 $('translated').textContent = PLACEHOLDER;

 if('speechSynthesis' in window){
  speechSynthesis.cancel();
 }

 $('status').textContent = 'გასუფთავებულია';
});

// Service Worker
if('serviceWorker' in navigator){
 window.addEventListener('load',function(){
  navigator.serviceWorker.register('./sw.js').catch(function(){});
 });
}

</script>
</body>
</html>
