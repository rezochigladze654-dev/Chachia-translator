<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>Chachia Translator</title>
<style>
* { box-sizing:border-box; }
html, body {
  margin:0;
  width:100%;
  min-height:100%;
  background:#101827;
  color:white;
  font-family:Arial,sans-serif;
}
body { min-height:100vh; min-height:100dvh; }
.app {
  width:100%;
  min-height:100vh;
  min-height:100dvh;
  padding:20px 14px;
  padding-top:max(20px, env(safe-area-inset-top));
  padding-bottom:max(20px, env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  gap:16px;
}
h1 { text-align:center; font-size:26px; margin:10px 0 0; }
.subtitle { text-align:center; color:#b8c7dc; margin:0; }
textarea {
  display:block;
  width:100%;
  min-height:180px;
  padding:16px;
  border:2px solid #40516c;
  border-radius:14px;
  background:#202d40;
  color:white;
  font-size:19px;
  resize:vertical;
}
button {
  display:block;
  width:100%;
  min-height:54px;
  border:0;
  border-radius:14px;
  background:#2786f5;
  color:white;
  font-size:18px;
  font-weight:bold;
}
.output {
  width:100%;
  min-height:160px;
  padding:17px;
  border-radius:14px;
  background:#202d40;
  border:1px solid #40516c;
  font-size:20px;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}
.status { text-align:center; color:#b8c7dc; font-size:14px; }
</style>
</head>
<body>
<main class="app">
  <h1>🌍 Chachia Translator</h1>
  <p class="subtitle">ქართული ⇄ გერმანული</p>

  <textarea id="source" placeholder="დაწერე ტექსტი აქ..."></textarea>

  <button id="translate">თარგმნა</button>

  <div class="output" id="result">თარგმანი გამოჩნდება აქ</div>

  <button id="copy">კოპირება</button>
  <div class="status" id="status">მზად არის</div>
</main>

<script>
const source = document.getElementById("source");
const result = document.getElementById("result");
const status = document.getElementById("status");

document.getElementById("translate").addEventListener("click", async () => {
  const input = source.value.trim();

  if (!input) {
    status.textContent = "ჯერ ჩაწერე ტექსტი";
    return;
  }

  const isGeorgian = /[\u10A0-\u10FF]/.test(input);
  const from = isGeorgian ? "ka" : "de";
  const to = isGeorgian ? "de" : "ka";

  result.textContent = "ითარგმნება...";
  status.textContent = "გთხოვ დაელოდე";

  try {
    const url =
      "https://translate.googleapis.com/translate_a/single?client=gtx&sl=" +
      from + "&tl=" + to + "&dt=t&q=" + encodeURIComponent(input);

    const response = await fetch(url);
    if (!response.ok) throw new Error("Network error");

    const data = await response.json();
    result.textContent = data[0].map(part => part[0] || "").join("");
    status.textContent = "თარგმნა დასრულდა ✓";
  } catch (error) {
    result.textContent = "თარგმნა ვერ მოხერხდა. შეამოწმე ინტერნეტი.";
    status.textContent = "შეცდომა";
  }
});

document.getElementById("copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(result.textContent);
    status.textContent = "კოპირებულია ✓";
  } catch (error) {
    status.textContent = "კოპირება ვერ მოხერხდა";
  }
});
</script>
</body>
</html>
