
<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101b36">
<meta name="mobile-web-app-capable" content="yes">
<title>Chachia Translator</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;min-height:100%;
 background:#101b36;color:white;
 font-family:Arial,sans-serif;
}
body{min-height:100dvh}
main{
 width:100%;max-width:600px;margin:auto;
 padding:20px 15px 35px;
}
h1{text-align:center;font-size:28px;margin:15px 0 5px}
.sub{text-align:center;color:#aab9d6;margin-bottom:24px}
.panel{
 background:#1b2a49;border:1px solid #344769;
 border-radius:18px;padding:16px;margin:14px 0;
}
label{display:block;font-weight:bold;margin-bottom:12px}
textarea{
 width:100%;min-height:120px;resize:vertical;
 border:0;border-radius:12px;padding:14px;
 background:#0e1930;color:white;font-size:18px;
 line-height:1.5;outline:none;
}
textarea::placeholder{color:#8999b8}
.actions{display:flex;gap:9px;margin-top:13px;flex-wrap:wrap}
button{
 flex:1;min-width:0;border:0;border-radius:12px;
 padding:14px 9px;font-size:15px;font-weight:bold;
 cursor:pointer;touch-action:manipulation;
}
.mic{background:#315c9d;color:white}
.mic.active{background:#d34c55;color:white}
.mainbtn{background:#3979db;color:white}
.secondary{background:#344563;color:white}
.status{
 text-align:center;color:#c4d4f0;
 min-height:25px;font-size:14px;margin:12px 0;
}
#translated{
 min-height:110px;white-space:pre-wrap;
 overflow-wrap:anywhere;font-size:19px;line-height:1.6;
}
.footer{text-align:center;color:#8294b6;font-size:12px;margin:25px 0}
@media(max-width:360px){
 main{padding:12px 10px}
 .panel{padding:13px}
 button{font-size:12px;padding:13px 5px}
 h1{font-size:24px}
}
</style>
</head>

<body>
<main>
<h1>Chachia Translator</h1>
<div class="sub">ქართული ⇄ გერმანული</div>

<div class="panel">
<label>ჩაწერე ტექსტი</label>
<textarea id="source" placeholder="დაწერე ქართულად ან გერმანულად..."></textarea>
<div class="actions">
<button class="mic" id="kaMic">🎤 ქართული</button>
<button class="mic" id="deMic">🎤 Deutsch</button>
</div>
</div>

<div class="status" id="status">მზად არის</div>

<div class="panel">
<label>თარგმანი</label>
<div id="translated">აქ გამოჩნდება თარგმანი...</div>
<div class="actions">
<button class="mainbtn" id="speakBtn">🔊 მოსმენა</button>
<button class="secondary" id="copyBtn">📋 კოპირება</button>
<button class="secondary" id="clearBtn">გასუფთავება</button>
</div>
</div>

<div class="footer">Chachia Translator · Georgian ⇄ German</div>
</main>

<script>
"use strict";

const $=id=>document.getElementById(id);
const PLACEHOLDER='აქ გამოჩნდება თარგმანი...';

let recognition=null;
let activeLanguage=null;
let sessionId=0;
let timer=null;
let requestId=0;
let speaking=false;
let micWanted=false;
let restartTimer=null;
let lastSpeech='';

function isGeorgian(t){
 return /[\u10A0-\u10FF]/.test(t);
}

function updateButtons(){
 const ka=activeLanguage==='ka-GE';
 const de=activeLanguage==='de-DE';

 $('kaMic').classList.toggle('active',ka);
 $('deMic').classList.toggle('active',de);

 $('kaMic').textContent=ka?'🔴 გამორთვა':'🎤 ქართული';
 $('deMic').textContent=de?'🔴 გამორთვა':'🎤 Deutsch';
}

function cleanSpeech(text){
 return text
  .replace(/[\u200B-\u200D\uFEFF]/g,'')
  .replace(/\s+/g,' ')
  .trim();
}

function stopMic(message='მიკროფონი გამორთულია'){
 micWanted=false;
 sessionId++;

 clearTimeout(restartTimer);

 const old=recognition;
 recognition=null;
 activeLanguage=null;
 updateButtons();

 if(old){
  old.onresult=null;
  old.onerror=null;
  old.onend=null;
  try{old.abort()}catch(e){}
 }

 if(message)$('status').textContent=message;
}

function createRecognition(lang,id){
 if(!micWanted || id!==sessionId)return;

 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

 if(!SR){
  stopMic('ამ აპლიკაციაში ხმოვანი ამოცნობა მიუწვდომელია');
  return;
 }

 const rec=new SR();
 recognition=rec;

 rec.lang=lang;
 rec.continuous=true;
 rec.interimResults=false;
 rec.maxAlternatives=1;

 rec.onstart=function(){
  if(id!==sessionId || !micWanted)return;
  $('status').textContent=lang==='ka-GE'
   ?'🎤 გისმენ... ქართულად ილაპარაკე'
   :'🎤 Ich höre zu... Sprich Deutsch';
 };

 rec.onresult=function(event){
  if(id!==sessionId || !micWanted)return;

  let text='';

  for(let i=event.resultIndex;i<event.results.length;i++){
   if(event.results[i].isFinal){
    text+=event.results[i][0].transcript+' ';
   }
  }

  text=cleanSpeech(text);
  if(!text || text===lastSpeech)return;

  lastSpeech=text;

  const source=$('source');
  const oldText=source.value.trim();

  source.value=oldText
   ?oldText+' '+text
   :text;

  clearTimeout(timer);
  translateText();

  $('status').textContent='ხმა ჩაიწერა ✓';
 };

 rec.onerror=function(event){
  if(id!==sessionId || !micWanted)return;

  if(event.error==='not-allowed' || event.error==='service-not-allowed'){
   stopMic('მიკროფონის ნებართვა ან ხმოვანი სერვისი მიუწვდომელია');
  }else if(event.error==='no-speech'){
   $('status').textContent='გისმენ... ხმა ჯერ არ ისმის';
  }else if(event.error==='network'){
   stopMic('ხმოვანი ამოცნობის ქსელური შეცდომა');
  }else if(event.error!=='aborted'){
   $('status').textContent='მიკროფონის შეცდომა: '+event.error;
  }
 };

 rec.onend=function(){
  if(id!==sessionId || !micWanted)return;

  recognition=null;

  $('status').textContent='მოსმენა გრძელდება...';

  // თუ მომხმარებელს არ გამოურთავს, მოსმენა ხელახლა დაიწყოს
  restartTimer=setTimeout(()=>{
   if(id===sessionId && micWanted && !recognition){
    createRecognition(lang,id);
   }
  },400);
 };

 try{
  rec.start();
 }catch(e){
  if(id===sessionId && micWanted){
   stopMic('მიკროფონი ვერ ჩაირთო. თავიდან სცადე');
  }
 }
}

function startMic(lang){
 if(micWanted && activeLanguage===lang){
  stopMic('🔴 მიკროფონი გამორთულია');
  return;
 }

 if(micWanted){
  stopMic(null);
 }

 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

 if(!SR){
  $('status').textContent='ამ აპლიკაციაში ხმოვანი ამოცნობა მიუწვდომელია';
  return;
 }

 clearTimeout(restartTimer);

 sessionId++;
 const id=sessionId;

 micWanted=true;
 activeLanguage=lang;
 lastSpeech='';

 updateButtons();
 createRecognition(lang,id);
}

$('kaMic').addEventListener('click',()=>startMic('ka-GE'));
$('deMic').addEventListener('click',()=>startMic('de-DE'));

// თარგმანი
async function translateText(){
 const original=$('source').value.trim();

 if(!original){
  $('translated').textContent=PLACEHOLDER;
  return;
 }

 const id=++requestId;
 const target=isGeorgian(original)?'de':'ka';

 $('status').textContent='ითარგმნება...';

 try{
  const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl='+
   target+'&dt=t&q='+encodeURIComponent(original);

  const response=await fetch(url);
  if(!response.ok)throw new Error();

  const data=await response.json();
  const result=(data[0]||[]).map(x=>x[0]||'').join('');

  if(id!==requestId)return;
  if(!result.trim())throw new Error();

  $('translated').textContent=result;
  $('status').textContent='თარგმნა დასრულდა ✓';

 }catch(e){
  if(id!==requestId)return;

  try{
   const pair=target==='de'?'ka|de':'de|ka';
   const url='https://api.mymemory.translated.net/get?q='+
    encodeURIComponent(original)+'&langpair='+pair;

   const response=await fetch(url);
   if(!response.ok)throw new Error();

   const data=await response.json();
   if(id!==requestId)return;

   const result=data.responseData?.translatedText;

   if(result){
    $('translated').textContent=result;
    $('status').textContent='თარგმნა დასრულდა ✓';
   }else{
    $('status').textContent='თარგმანი ვერ მოიძებნა';
   }
  }catch(err){
   if(id===requestId)$('status').textContent='ინტერნეტთან კავშირი შეამოწმე';
  }
 }
}

// ტექსტის ავტომატური თარგმნა
$('source').addEventListener('input',()=>{
 clearTimeout(timer);
 timer=setTimeout(translateText,600);
});

// გახმოვანება
$('speakBtn').addEventListener('click',()=>{
 const text=$('translated').textContent;

 if(!text||text===PLACEHOLDER)return;
 if(!window.speechSynthesis)return;

 if(speaking){
  speechSynthesis.cancel();
  speaking=false;
  $('status').textContent='გახმოვანება შეწყდა';
  return;
 }

 speechSynthesis.cancel();

 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang=isGeorgian(text)?'ka-GE':'de-DE';
 utterance.rate=0.9;

 utterance.onstart=()=>speaking=true;
 utterance.onend=()=>speaking=false;
 utterance.onerror=()=>speaking=false;

 speechSynthesis.speak(utterance);
});

// კოპირება
$('copyBtn').addEventListener('click',async()=>{
 const text=$('translated').textContent;
 if(!text||text===PLACEHOLDER)return;

 try{
  if(navigator.clipboard&&window.isSecureContext){
   await navigator.clipboard.writeText(text);
  }else{
   const t=document.createElement('textarea');
   t.value=text;
   document.body.appendChild(t);
   t.select();
   const ok=document.execCommand('copy');
   t.remove();
   if(!ok)throw new Error();
  }
  $('status').textContent='ტექსტი დაკოპირდა ✓';
 }catch(e){
  $('status').textContent='კოპირება ვერ მოხერხდა';
 }
});

// გასუფთავება
$('clearBtn').addEventListener('click',()=>{
 stopMic(null);
 clearTimeout(timer);
 requestId++;

 $('source').value='';
 $('translated').textContent=PLACEHOLDER;

 if(window.speechSynthesis)speechSynthesis.cancel();
 speaking=false;

 $('status').textContent='გასუფთავებულია';
});
</script>
</body>
</html>
