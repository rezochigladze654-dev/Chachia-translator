<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101b36">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chachia Translator</title>
<link rel="manifest" href="./manifest.json">
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:18px;background:#101b36;color:white;
 font-family:Arial,sans-serif;min-height:100vh
}
main{max-width:600px;margin:auto}
h1{text-align:center;font-size:27px;margin:15px 0 5px}
.sub{text-align:center;color:#aab9d6;margin-bottom:25px}
.panel{
 background:#1b2a49;border:1px solid #344769;
 border-radius:18px;padding:16px;margin:14px 0
}
label{display:block;font-weight:bold;margin-bottom:12px}
textarea{
 width:100%;min-height:125px;resize:vertical;
 border:0;border-radius:12px;padding:14px;
 background:#0e1930;color:white;font-size:18px;
 outline:none;line-height:1.5
}
textarea::placeholder{color:#8999b8}
button{
 border:0;border-radius:12px;padding:13px 15px;
 font-size:15px;font-weight:bold;cursor:pointer
}
button:disabled{opacity:.5}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.actions button{flex:1}
.mic{background:#315c9d;color:white}
.mainbtn{background:#3979db;color:white}
.secondary{background:#344563;color:white}
#translated{
 min-height:100px;white-space:pre-wrap;
 overflow-wrap:anywhere;font-size:19px;
 line-height:1.5;color:#fff
}
.status{text-align:center;color:#b8c9e8;font-size:14px;min-height:22px}
.footer{text-align:center;color:#8294b6;font-size:12px;margin:25px 0}
</style>
</head>
<body>
<main>
<h1>Chachia Translator</h1>
<div class="sub">ქართული ⇄ გერმანული</div>

<div class="panel">
<label>ჩაწერე ტექსტი</label>
<textarea id="source" placeholder="დაწერე ქართულად ან გერმანულად..."></textarea>
<div class="actions">
<button class="mic" id="kaMic">🎤 ქართული</button>
<button class="mic" id="deMic">🎤 Deutsch</button>
</div>
</div>

<div class="status" id="status">მზად არის</div>

<div class="panel">
<label>თარგმანი</label>
<div id="translated">აქ გამოჩნდება თარგმანი...</div>
<div class="actions">
<button class="mainbtn" id="speakBtn">🔊 მოსმენა</button>
<button class="secondary" id="copyBtn">📋 კოპირება</button>
<button class="secondary" id="clearBtn">გასუფთავება</button>
</div>
</div>

<div class="footer">Chachia Translator · Georgian ⇄ German</div>
</main>

<script>
const $ = id => document.getElementById(id);

let timer = null;
let requestNumber = 0;
let recognition = null;
let listening = false;
let micSession = 0;

function isGeorgian(text){
 return /[\u10A0-\u10FF]/.test(text);
}

// ხმოვანი ტექსტის გაწმენდა
function cleanSpeech(text){
 let words = text
  .replace(/[\u200B-\u200D\uFEFF]/g,'')
  .trim()
  .split(/\s+/)
  .filter(Boolean);

 const norm = word => word
  .toLocaleLowerCase()
  .normalize('NFC')
  .replace(/[.,!?;:„“"'()[\]{}،؛]/g,'');

 let result = [];

 for(const word of words){
  const key = norm(word);
  if(!key) continue;

  // ზედიზედ გამეორებული სიტყვის მოცილება
  if(result.length && norm(result[result.length-1]) === key){
   continue;
  }

  result.push(word);
 }

 // გამეორებული ფრაზების მოცილება
 let changed = true;
 while(changed){
  changed = false;

  for(let size=Math.min(12,Math.floor(result.length/2));size>=1;size--){
   const first=result.slice(-size*2,-size).map(norm).join(' ');
   const second=result.slice(-size).map(norm).join(' ');

   if(first && first===second){
    result.splice(-size,size);
    changed=true;
    break;
   }
  }
 }

 return result.join(' ');
}

async function translateText(){
 const original=$('source').value.trim();

 if(!original){
  $('translated').textContent='აქ გამოჩნდება თარგმანი...';
  return;
 }

 const thisRequest=++requestNumber;
 const target=isGeorgian(original)?'de':'ka';

 $('status').textContent='ითარგმნება...';

 try{
  const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl='
   +target+'&dt=t&q='+encodeURIComponent(original);

  const response=await fetch(url);
  if(!response.ok) throw new Error('Google error');

  const data=await response.json();
  const result=data[0].map(item=>item[0]).join('');

  if(thisRequest!==requestNumber)return;

  $('translated').textContent=result||'თარგმანი ვერ მოიძებნა';
  $('status').textContent='თარგმნა დასრულდა';

 }catch(error){
  try{
   const url='https://api.mymemory.translated.net/get?q='
    +encodeURIComponent(original)+'&langpair='
    +(target==='de'?'ka|de':'de|ka');

   const response=await fetch(url);
   const data=await response.json();

   if(thisRequest!==requestNumber)return;

   if(data.responseData&&data.responseData.translatedText){
    $('translated').textContent=data.responseData.translatedText;
    $('status').textContent='თარგმნა დასრულდა';
   }else{
    $('status').textContent='თარგმნა ვერ მოხერხდა';
   }
  }catch(e){
   if(thisRequest===requestNumber){
    $('status').textContent='ინტერნეტთან კავშირი შეამოწმე';
   }
  }
 }
}

function scheduleTranslation(){
 clearTimeout(timer);
 timer=setTimeout(translateText,600);
}

$('source').addEventListener('input',scheduleTranslation);

// მიკროფონის ღილაკების მდგომარეობა
function micButtons(disabled){
 $('kaMic').disabled=disabled;
 $('deMic').disabled=disabled;
}

function stopMic(){
 micSession++;

 if(recognition){
  const old=recognition;
  recognition=null;
  listening=false;
  try{old.abort();}catch(e){}
 }

 micButtons(false);
}

function startMic(language){
 const SpeechRecognition=window.SpeechRecognition||
  window.webkitSpeechRecognition;

 if(!SpeechRecognition){
  $('status').textContent='ამ ბრაუზერში მიკროფონი მიუწვდომელია';
  return;
 }

 // ძველი სესიის გაუქმება
 if(recognition){
  stopMic();
 }

 const mySession=++micSession;
 const current=new SpeechRecognition();

 recognition=current;
 listening=true;
 micButtons(true);

 let handled=false;

 current.lang=language;
 current.continuous=false;
 current.interimResults=false;
 current.maxAlternatives=1;

 $('status').textContent='🎤 გისმენ...';

 current.onresult=function(event){
  if(mySession!==micSession)return;
  if(handled)return;

  let parts=[];

  // ვიღებთ მხოლოდ ახალ, საბოლოო შედეგებს
  for(let i=event.resultIndex;i<event.results.length;i++){
   const item=event.results[i];

   if(item.isFinal){
    parts.push(item[0].transcript);
   }
  }

  let transcript=cleanSpeech(parts.join(' '));

  if(!transcript)return;

  handled=true;

  $('source').value=transcript;
  clearTimeout(timer);
  translateText();

  $('status').textContent='ამოცნობა დასრულდა';

  try{current.stop();}catch(e){}
 };

 current.onerror=function(event){
  if(mySession!==micSession)return;

  listening=false;
  recognition=null;
  micButtons(false);

  if(event.error==='not-allowed'){
   $('status').textContent='მიკროფონის ნებართვა ჩართე';
  }else if(event.error==='no-speech'){
   $('status').textContent='ხმა ვერ გავიგე. კიდევ სცადე';
  }else{
   $('status').textContent='მიკროფონის შეცდომა: '+event.error;
  }
 };

 current.onend=function(){
  if(mySession!==micSession)return;

  listening=false;
  recognition=null;
  micButtons(false);

  if(!handled){
   $('status').textContent='მზად არის';
  }
 };

 try{
  current.start();
 }catch(error){
  if(mySession===micSession){
   listening=false;
   recognition=null;
   micButtons(false);
   $('status').textContent='მიკროფონი ვერ ჩაირთო';
  }
 }
}

$('kaMic').addEventListener('click',()=>startMic('ka-GE'));
$('deMic').addEventListener('click',()=>startMic('de-DE'));

$('speakBtn').addEventListener('click',()=>{
 const text=$('translated').textContent;

 if(!text||text==='აქ გამოჩნდება თარგმანი...')return;

 speechSynthesis.cancel();

 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang=isGeorgian(text)?'ka-GE':'de-DE';
 utterance.rate=0.9;

 speechSynthesis.speak(utterance);
});

$('copyBtn').addEventListener('click',async()=>{
 const text=$('translated').textContent;

 if(!text||text==='აქ გამოჩნდება თარგმანი...')return;

 try{
  await navigator.clipboard.writeText(text);
  $('status').textContent='ტექსტი დაკოპირდა';
 }catch(e){
  $('status').textContent='კოპირება ვერ მოხერხდა';
 }
});

$('clearBtn').addEventListener('click',()=>{
 stopMic();

 $('source').value='';
 $('translated').textContent='აქ გამოჩნდება თარგმანი...';
 $('status').textContent='გასუფთავებულია';

 speechSynthesis.cancel();
 clearTimeout(timer);
 requestNumber++;
});

if('serviceWorker' in navigator){
 window.addEventListener('load',()=>{
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
 });
}
</script>
</body>
</html>
